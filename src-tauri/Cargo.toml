[package]
name = "aether"
version = "0.2.1"
description = "Aether — a free, personal weather app. Forecast receipts, atmosphere to space."
edition = "2021"
rust-version = "1.77.2"
publish = false

[lib]
name = "aether_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# The native bonus: Rust-side HTTP exposed to JS, immune to webview CORS. This is what turns
# gfz-kp (official Kp, no CORS header) from a documented limitation into a direct call.
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
