<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1220" />
    <meta
      name="description"
      content="Aether — a free, personal weather app. Forecast receipts, atmosphere to space."
    />
    <title>Aether</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
  </head>
  <body>
    <div id="map"></div>
    <canvas id="wind" aria-hidden="true"></canvas>
    <div id="wind-chip" hidden></div>

    <header id="topbar">
      <h1>AETHER</h1>
      <span class="hint">click the map to add a location</span>
      <button id="wind-toggle" title="Toggle the wind particle layer">〰 Wind</button>
      <button id="refresh" title="Refresh all forecasts">↻ Refresh</button>
    </header>

    <section id="cards" aria-label="Saved locations"></section>

    <footer id="footer"></footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
