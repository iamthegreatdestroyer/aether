<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1220" />
    <meta
      name="description"
      content="Aether — a free, personal weather app. Forecast receipts, atmosphere to space."
    />
    <title>Aether</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
  </head>
  <body>
    <div id="map"></div>
    <canvas id="wind" aria-hidden="true"></canvas>
    <div id="wind-chip" hidden></div>

    <header id="topbar">
      <h1>AETHER</h1>
      <span class="hint">click the map to add a location</span>
      <button id="route-toggle" title="Route forecast — weather where you'll be, when you'll be there">🧭 Route</button>
      <button id="storms-toggle" title="Storm ledger — which model has been closest, verified live">🌀 Storms</button>
      <button id="space-toggle" title="Solar wind, Kp, aurora × cloud, live radiosondes">☀ Space</button>
      <button id="smoke-toggle" title="Smoke story — fires upwind, ray-tested against surface wind, PM2.5 truth">🔥 Smoke</button>
      <button id="receipts-toggle" title="Who was right? Forecast receipts, scored against real observations">🏆 Receipts</button>
      <button id="radar-toggle" title="Toggle the radar layer">◉ Radar</button>
      <button id="sat-toggle" title="Toggle the satellite layer">🛰 Sat</button>
      <button id="ltng-toggle" title="Live lightning — GLM flashes from GOES-East/West, last 5 min (Americas field of view)">⚡ Ltng</button>
      <button id="div-toggle" title="AI vs physics — where ECMWF's IFS and AIFS disagree">🤖 AI Δ</button>
      <button id="wind-toggle" title="Toggle the wind particle layer">〰 Wind</button>
      <button id="home-pin" title="Pin your current location as Home (asks the browser for location permission once)">📍 Home</button>
      <button id="refresh" title="Refresh all forecasts">↻ Refresh</button>
    </header>

    <div id="route-bar" hidden></div>
    <div id="div-legend" hidden></div>

    <div id="timeline" hidden>
      <button id="tl-play" title="Play / pause the radar loop">⏸</button>
      <input id="tl-scrub" type="range" min="0" max="0" value="0" step="1" />
      <span id="tl-label"></span>
      <span id="tl-provider" title="Active radar provider"></span>
    </div>

    <section id="cards" aria-label="Saved locations"></section>

    <footer id="footer"></footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
