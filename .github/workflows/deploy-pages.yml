name: Deploy to Pages

# The P0 exit path: build the PWA and publish it to GitHub Pages. Free on public repos —
# which is the entire Tier B hosting thesis. Activates once the repo is pushed and Pages is
# set to "GitHub Actions" in Settings → Pages.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'spike/**'
      - 'docs/**'
      - '*.md'
  schedule:
    # The Tier B wind-texture cron (proposal §5.2.3): rebuild + redeploy every 6 h with the
    # freshest published GFS cycle. Artifact deploys, so no data commits pollute history —
    # the committed texture stays as the dev fallback / last-known-good. Minutes offset off
    # the hour per Actions etiquette; timed ~4.5 h after each cycle (00/06/12/18Z), when
    # f000 is reliably published. The builder walks back a cycle if it isn't.
    - cron: '27 4,10,16,22 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # The contract gate protects what we SHIP, so it is fatal when the CODE changed (push)
      # or a human asked for a deploy (workflow_dispatch). It is deliberately NOT fatal on the
      # 6-hourly SCHEDULE: that run ships the same code that already passed this gate, and its
      # whole job is refreshing the baked data. Blocking it over one drifted source cannot make
      # the app any better and guarantees stale wind, fires and tides. It has frozen the data
      # cron twice — 2026-08-27..29 (DONKI 503s) and 2026-09-30..10-03 (DONKI moved, ~70 h
      # stale) — both times over a source the app itself degrades around in one line.
      # The alarm is not lost: the strict daily "Endpoint contract" audit still goes red, and
      # the warning step below puts the drift on this run too. A third party merely unreachable
      # from the runner never blocks either way (--soft-unreachable).
      - id: probe
        run: node scripts/probe-sources.mjs --tier A --soft-unreachable
        continue-on-error: ${{ github.event_name == 'schedule' }}
      - name: Contract drift on a scheduled refresh (data refreshed anyway)
        if: ${{ github.event_name == 'schedule' && steps.probe.outcome == 'failure' }}
        run: |
          echo "::warning title=Contract drift::The endpoint probe failed on a scheduled refresh. Data was rebuilt and deployed anyway; the strict daily Endpoint contract audit owns the alarm. Run: node scripts/probe-sources.mjs --include-polite"
      - run: node scripts/gen-attribution.mjs --check
      # The Tauri HTTP allowlist is derived from the same contract — a hand-edited scope is
      # how the desktop build silently blocked 20 of 22 hosts after P6.
      - run: node scripts/gen-capabilities.mjs --check
      # Tier B: refresh the wind texture from the latest GFS cycle. Pure-Python decoder —
      # no ecCodes, no apt-get, nothing tied to the runner image. `|| true` is deliberate:
      # a NOMADS outage must degrade to the committed last-known-good texture, not block
      # the app deploy.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
                # Start from what is LIVE, not from what is committed. Without this,
      # "deploying last-known-good" meant the repo's dev snapshots — measured
      # 2026-08-29, one failed FIRMS fetch republished 08-18 data over 08-27
      # data and the smoke panel advertised the older date. Each file states
      # its own build time, so only genuinely newer deployed copies replace
      # committed ones; stdlib only, and never fatal.
      - run: python scripts/seed_deployed_data.py
      # eccodes: the divergence lane's GRIB decoder — ECMWF packs with CCSDS (template
      # 5.42), beyond the pure-Python decoder. Linux wheels bundle the native library.
      - run: pip install numpy pillow eccodes
      - run: python scripts/build_wind_texture.py || echo "::warning::texture refresh failed — deploying last-known-good"
      # Storm ledger: same 6-hour cadence as NHC advisories, same degrade-to-snapshot rule.
      - run: python scripts/build_storm_ledger.py || echo "::warning::storm ledger refresh failed — deploying last-known-good"
      # Smoke Story: FIRMS VIIRS 24 h detections thinned to 0.25 deg clusters. Same rule.
      - run: python scripts/build_fire_clusters.py || echo "::warning::fire cluster refresh failed — deploying last-known-good"
      # Marine: thin the 2 MB tide-station directory and bake every buoy's latest obs.
      - run: python scripts/build_marine_stations.py || echo "::warning::marine station refresh failed — deploying last-known-good"
      # AI-vs-physics divergence: IFS + AIFS 2t via Range requests, 5 leads. Same rule.
      - run: python scripts/build_divergence.py || echo "::warning::divergence refresh failed — deploying last-known-good"
      - run: pnpm build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
