name: Deploy to Pages

# The P0 exit path: build the PWA and publish it to GitHub Pages. Free on public repos —
# which is the entire Tier B hosting thesis. Activates once the repo is pushed and Pages is
# set to "GitHub Actions" in Settings → Pages.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'spike/**'
      - 'docs/**'
      - '*.md'
  schedule:
    # The Tier B wind-texture cron (proposal §5.2.3): rebuild + redeploy every 6 h with the
    # freshest published GFS cycle. Artifact deploys, so no data commits pollute history —
    # the committed texture stays as the dev fallback / last-known-good. Minutes offset off
    # the hour per Actions etiquette; timed ~4.5 h after each cycle (00/06/12/18Z), when
    # f000 is reliably published. The builder walks back a cycle if it isn't.
    - cron: '27 4,10,16,22 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # The contract must hold before a deploy — same guards as the daily probe.
      # Contract drift still blocks the deploy; a third party unreachable from this
      # runner does not — that is what the strict daily audit is for.
      - run: node scripts/probe-sources.mjs --tier A --soft-unreachable
      - run: node scripts/gen-attribution.mjs --check
      # The Tauri HTTP allowlist is derived from the same contract — a hand-edited scope is
      # how the desktop build silently blocked 20 of 22 hosts after P6.
      - run: node scripts/gen-capabilities.mjs --check
      # Tier B: refresh the wind texture from the latest GFS cycle. Pure-Python decoder —
      # no ecCodes, no apt-get, nothing tied to the runner image. `|| true` is deliberate:
      # a NOMADS outage must degrade to the committed last-known-good texture, not block
      # the app deploy.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # eccodes: the divergence lane's GRIB decoder — ECMWF packs with CCSDS (template
      # 5.42), beyond the pure-Python decoder. Linux wheels bundle the native library.
      - run: pip install numpy pillow eccodes
      - run: python scripts/build_wind_texture.py || echo "::warning::texture refresh failed — deploying last-known-good"
      # Storm ledger: same 6-hour cadence as NHC advisories, same degrade-to-snapshot rule.
      - run: python scripts/build_storm_ledger.py || echo "::warning::storm ledger refresh failed — deploying last-known-good"
      # Smoke Story: FIRMS VIIRS 24 h detections thinned to 0.25 deg clusters. Same rule.
      - run: python scripts/build_fire_clusters.py || echo "::warning::fire cluster refresh failed — deploying last-known-good"
      # AI-vs-physics divergence: IFS + AIFS 2t via Range requests, 5 leads. Same rule.
      - run: python scripts/build_divergence.py || echo "::warning::divergence refresh failed — deploying last-known-good"
      - run: pnpm build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
