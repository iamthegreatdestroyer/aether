<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aether widget</title>
    <style>
      /* Self-contained on purpose: the widget must not pull the app's full stylesheet or
         a background — it floats transparent on the user's desktop. */
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { background: transparent; overflow: hidden; }
      body {
        font: 12px/1.4 system-ui, 'Segoe UI', sans-serif;
        color: #dbe2f0;
        -webkit-user-select: none;
        user-select: none;
      }
      #w {
        background: rgba(11, 18, 32, 0.88);
        border: 1px solid rgba(120, 140, 170, 0.25);
        border-radius: 14px;
        padding: 10px 12px 8px;
        height: 100vh;
        display: flex;
        flex-direction: column;
        backdrop-filter: blur(6px);
      }
      #head { display: flex; align-items: baseline; gap: 8px; }
      #name { font-weight: 700; font-size: 13px; }
      #now { font-size: 22px; font-weight: 700; }
      #glyph { font-size: 18px; }
      #meta { margin-left: auto; color: #8a93a6; font-size: 10px; text-align: right; }
      #days { display: flex; flex: 1; margin-top: 6px; gap: 4px; }
      .d { flex: 1; text-align: center; border-radius: 8px; padding: 2px 0; }
      .d .n { color: #8a93a6; font-size: 10px; }
      .d .g { font-size: 15px; }
      .d .t { font-size: 11px; }
      .d .t b { font-size: 12px; }
      .d .p { height: 3px; border-radius: 2px; background: rgba(106, 169, 255, 0.15); margin: 3px 6px 0; overflow: hidden; }
      .d .p i { display: block; height: 100%; background: #6aa9ff; }
      #err { color: #ff9a3c; font-size: 11px; margin-top: 8px; }
    </style>
  </head>
  <body>
    <!-- The whole widget is a drag region: grab anywhere, place it anywhere. -->
    <div id="w" data-tauri-drag-region>
      <div id="head" data-tauri-drag-region>
        <span id="name" data-tauri-drag-region>…</span>
        <span id="now" data-tauri-drag-region></span>
        <span id="glyph" data-tauri-drag-region></span>
        <span id="meta" data-tauri-drag-region></span>
      </div>
      <div id="days" data-tauri-drag-region></div>
    </div>
    <script type="module" src="/src/widget/widgetMain.ts"></script>
  </body>
</html>
