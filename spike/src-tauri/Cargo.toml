[package]
name = "aether-spike"
version = "0.0.0"
description = "G0.6 — does the particle engine survive Tauri's webview?"
edition = "2021"
rust-version = "1.77.2"
publish = false

[lib]
name = "aether_spike_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The spike is a measurement tool, not a shipped binary — optimise for build time.
[profile.dev]
incremental = true
